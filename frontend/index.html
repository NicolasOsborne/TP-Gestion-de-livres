<!DOCTYPE html>
<html lang="fr">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Gestion de Livres</title>
   <link rel="stylesheet" href="styles/styles.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
</head>

<body>

   <div class="window">
      <div class="title-bar">
         <div class="title-bar-text">Gestion de Livres</div>
         <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
         </div>
      </div>

      <div class="window-body">
         <fieldset>
            <legend>Ajouter un nouveau livre</legend>
            <form id="addBookForm" class="form-grid">
               <input type="text" id="add-title" placeholder="Titre" required>
               <input type="text" id="add-author" placeholder="Auteur" required>
               <input type="text" id="add-isbn" placeholder="ISBN" required>
               <button type="submit">Ajouter le livre</button>
            </form>
         </fieldset>

         <div class="actions">
            <button id="listBooksButton">Lister tous les livres</button>
            <form id="getBookForm" class="form-inline">
               <input type="text" id="search-id" placeholder="Rechercher par ID..." required>
               <button type="submit">Rechercher</button>
            </form>
         </div>

         <div class="field-row-stacked">
            <label>Résultats :</label>
            <div id="results" class="results-container">
               <pre id="resultsContent">Vos résultats s'afficheront ici.</pre>
            </div>
         </div>
      </div>
   </div>

   <script type="module" src="js/app.js"></script>
</body>

</html>
